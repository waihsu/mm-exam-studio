name: exam-studio-mobile-ci

on:
  pull_request:
    paths:
      - "exam-studio/**"
      - ".github/workflows/exam-studio-mobile-ci.yml"
  push:
    branches:
      - main
    paths:
      - "exam-studio/**"
      - ".github/workflows/exam-studio-mobile-ci.yml"

jobs:
  quality:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: exam-studio
    env:
      EXPO_PUBLIC_API_BASE_URL: http://10.0.2.2:3000
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: exam-studio/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Checks
        run: npm run check

      - name: Lint
        run: npm run lint
